#cloud-config
# Bootstrap de l'instance de recette : Docker + Docker Compose + pare-feu.
# Exécuté une seule fois, au premier démarrage de la machine.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - ufw

runcmd:
  # --- Dépôt officiel Docker ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  # L'utilisateur par défaut de l'image Ubuntu peut piloter Docker sans sudo.
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  # --- Pare-feu : n'ouvrir que SSH + HTTP + HTTPS ---
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

# Un redémarrage garantit que les mises à jour noyau/paquets sont actives.
power_state:
  mode: reboot
  condition: true
  delay: now
